<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeGame — 100년을 점으로</title>
<meta name="description" content="100세까지의 인생을 점으로 보여주고, 매일의 퀘스트와 만다라트, 능력치와 트로피로 목표를 게임처럼 기록합니다.">
<meta property="og:title" content="LifeGame — 100년을 점으로">
<meta property="og:description" content="지나온 날과 남은 날, 그리고 오늘의 퀘스트와 트로피를 한눈에.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23D97757'/></svg>">
<script>
// GitHub Pages의 첫 화면: 마지막으로 보던 탭 페이지로 바로 이동
(function () {
  var PAGES = { life: 'life/life.html', today: 'today/today.html', mandala: 'mandala/mandala.html',
    travel: 'travel/travel.html', inv: 'inventory/inventory.html', trophy: 'trophy/trophy.html', wardrobe: 'wardrobe/wardrobe.html' };
  var tab = 'life';
  try { var st = JSON.parse(localStorage.getItem('lifegame.web.v1') || '{}'); if (PAGES[st.tab]) tab = st.tab; } catch (e) {}
  var q = new URLSearchParams(location.search);
  if (PAGES[q.get('tab')]) tab = q.get('tab');
  if (location.hash.indexOf('#sync=') === 0) tab = 'mandala';
  q.delete('tab');
  var qs = q.toString();
  location.replace(PAGES[tab] + (qs ? '?' + qs : '') + location.hash);
})();
</script>
</head>
<body>
<noscript><p><a href="life/life.html">LifeGame 열기</a></p></noscript>
</body>
</html>
