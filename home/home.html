<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeGame — 집</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23D97757'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../shared/lifegame.css">
<style>
/* 집 탭 전용 — 공통 토큰(--ink, --clay …)과 목록 모양(.goal, form.add)을 그대로 씀 */
.hm-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
.hm-bar .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.hm-bar .seg::-webkit-scrollbar { display: none; }
.seg button small { margin-left: 4px; color: var(--faint); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] small { color: var(--muted); }

.hm-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; font: inherit; color: inherit; padding: 0; cursor: pointer; }
.hm-open:hover .gtitle { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.hm-qty { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 14px; }

/* 유통기한: 넉넉하면 조용히, 사흘 안이면 clay, 지나면 반전 */
.hm-due { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hm-due.soon { color: var(--clay); font-weight: 600; }
.hm-due.over { background: var(--clay); color: #fff; border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.hm-food.over .gtitle { color: var(--muted); }

/* 소모품 재고: 앱의 점 언어 그대로 — 채운 점 = 남은 여분, 빈 고리 = 알림 기준까지 모자란 칸 */
.hm-dots { flex: none; display: flex; gap: 4px; align-items: center; min-width: 40px; justify-content: flex-end; }
.hm-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
.hm-dots i.need { background: transparent; border: 1.5px solid var(--clay); }
.hm-dots small { font-size: 12px; color: var(--muted); margin-left: 2px; font-variant-numeric: tabular-nums; }
.hm-act { flex: none; display: flex; gap: 6px; }
.hm-sup.low .gtitle::after { content: "살 것"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--clay); border: 1px solid var(--clay); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
@media (max-width: 560px) {
  .hm-sup { flex-wrap: wrap; row-gap: 10px; }
  .hm-sup .hm-open { flex-basis: calc(100% - 70px); }
  .hm-sup .hm-act { margin-left: auto; }
}

/* 살 것 */
.hm-buy-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hm-buy .gmeta b { color: var(--clay); font-weight: 600; }
.hm-buy.auto .chk { border-style: dashed; }

form.add input[type="date"] { flex: 0 1 160px; color: var(--ink); }
form.add input[type="number"] { width: 88px; }
.hm-datelab { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

dialog .igrid textarea { grid-column: 1 / -1; }
dialog .igrid input { flex: none; }
.hm-history { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

/* 되돌리기 안내 — 공통 토스트와 같은 모양, 버튼을 누를 수 있게 */
.hm-snack { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 21;
  transform: translate(-50%, 24px); opacity: 0; pointer-events: none; width: max-content; max-width: 92vw;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 18px;
  display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; transition: opacity .25s, transform .3s; }
.hm-snack.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.hm-snack span { flex: 0 1 auto; min-width: 0; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-snack button { flex: none; border: 0; background: transparent; color: var(--bg); font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.hm-snack button:hover { background: rgba(127,127,127,.25); }
@media (prefers-reduced-motion: reduce) { .hm-snack { transition: none; } }
</style>
</head>
<body data-page="home">
<div class="wrap">
  <div id="chrome-top"></div>

  <!-- 집: 이 탭의 화면은 이 파일에서만 관리해요. 데이터는 lifegame.home.v1 -->
  <section class="panel" id="tab-home">
    <div class="stats" id="hmStats"></div>

    <h2>냉장고·찬장</h2>
    <p class="sub">넣을 때 적고, 다 먹으면 동그라미를 눌러 지워요. 유통기한이 가까운 것부터 보여요.</p>
    <div class="hm-bar">
      <div class="seg" role="group" aria-label="보관 장소" id="foodSeg"></div>
    </div>
    <ul class="goal-list" id="foodList"></ul>
    <form class="add" id="foodForm">
      <input type="text" id="fName" placeholder="넣은 것 (쉼표로 여러 개: 우유, 두부)" maxlength="120" required aria-label="식재료 이름">
      <select id="fPlace" aria-label="보관 장소"></select>
      <label class="hm-datelab">유통기한<input type="date" id="fExp" aria-label="유통기한 (선택)"></label>
      <button class="btn" type="submit">넣기</button>
    </form>

    <h2>소모품</h2>
    <p class="sub">샴푸·세제처럼 다 쓰면 새로 뜯는 것들. 점 하나가 뜯지 않은 여분 하나예요. 새 걸 뜯을 때마다 '뜯음'을 누르면 얼마나 자주 떨어지는지 계산해 줘요.</p>
    <div class="hm-bar">
      <div class="seg" role="group" aria-label="분류" id="supSeg"></div>
    </div>
    <ul class="goal-list" id="supList"></ul>
    <form class="add" id="supForm">
      <input type="text" id="sName" placeholder="소모품 (예: 샴푸, 세탁세제)" maxlength="40" required aria-label="소모품 이름">
      <input type="text" id="sCat" list="catOptions" placeholder="분류" maxlength="12" aria-label="분류" style="flex:0 1 120px">
      <label class="hm-datelab">여분<input type="number" id="sStock" min="0" max="99" step="1" value="1" inputmode="numeric" aria-label="여분 개수"></label>
      <button class="btn" type="submit">추가</button>
    </form>
    <datalist id="catOptions"></datalist>

    <div class="hm-buy-head">
      <h2 style="margin-top:64px">살 것</h2>
      <button class="btn ghost small" type="button" id="copyBuy" hidden>목록 복사</button>
    </div>
    <p class="sub">여분이 알림 기준까지 줄어든 소모품은 저절로 올라와요. 장 볼 것을 직접 적어도 돼요.</p>
    <ul class="goal-list" id="buyList"></ul>
    <form class="add" id="buyForm">
      <input type="text" id="bName" placeholder="살 것 (쉼표로 여러 개)" maxlength="120" required aria-label="살 것">
      <button class="btn" type="submit">적기</button>
    </form>
  </section>

  <div id="chrome-bottom"></div>
</div>

<dialog id="foodDlg">
  <form method="dialog">
    <h3>식재료</h3>
    <input type="text" id="fdName" maxlength="40" required aria-label="이름" style="width:100%">
    <div class="igrid">
      <label>보관 장소<select id="fdPlace"></select></label>
      <label>양 (선택)<input type="text" id="fdQty" maxlength="16" placeholder="예: 2개, 반 통"></label>
      <label>유통기한<input type="date" id="fdExp"></label>
      <label>넣은 날<input type="date" id="fdAdded"></label>
      <textarea id="fdMemo" rows="2" maxlength="120" placeholder="한 줄 메모"></textarea>
    </div>
    <div class="row">
      <button class="btn ghost" type="button" id="fdDelete">다 먹음</button>
      <button class="btn ghost" value="cancel" formnovalidate>취소</button>
      <button class="btn" value="ok">저장</button>
    </div>
  </form>
</dialog>

<dialog id="supDlg">
  <form method="dialog">
    <h3>소모품</h3>
    <input type="text" id="sdName" maxlength="40" required aria-label="이름" style="width:100%">
    <div class="igrid">
      <label>분류<input type="text" id="sdCat" list="catOptions" maxlength="12"></label>
      <label>여분 (뜯지 않은 것)<input type="number" id="sdStock" min="0" max="99" step="1" inputmode="numeric"></label>
      <label style="grid-column:1/-1">여분이 몇 개 이하면 살 것에 올릴까요<input type="number" id="sdMin" min="0" max="20" step="1" inputmode="numeric"></label>
      <textarea id="sdMemo" rows="2" maxlength="120" placeholder="한 줄 메모 (예: 리필용 1.2L, 드럭스토어에서)"></textarea>
    </div>
    <p class="hm-history" id="sdHistory"></p>
    <div class="row">
      <button class="btn ghost" type="button" id="sdDelete">삭제</button>
      <button class="btn ghost" value="cancel" formnovalidate>취소</button>
      <button class="btn" value="ok">저장</button>
    </div>
  </form>
</dialog>

<div class="hm-snack" id="hmSnack" role="status" aria-live="polite"></div>

<script src="../shared/chrome.js"></script>
<script src="../shared/backup.js"></script>
<script src="../shared/lifegame.js"></script>
<script>
(() => {
'use strict';
const KEY = 'lifegame.home.v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => keyOf(new Date());
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const md = (k) => { const d = parse(k); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const splitNames = (s) => s.split(/[,，、\n]/).map((x) => x.trim()).filter(Boolean);

const PLACES = [['fridge', '냉장'], ['freezer', '냉동'], ['pantry', '찬장']];
const PLACE_NAME = Object.fromEntries(PLACES);
const DEFAULT_CATS = ['욕실', '세탁', '주방', '청소', '위생'];
const SOON = 3; // 유통기한이 이 날수 안이면 '임박'

/* ── 저장 ── */
function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { s = {}; }
  s.food = Array.isArray(s.food) ? s.food.filter((x) => x && x.name) : [];
  s.supplies = Array.isArray(s.supplies) ? s.supplies.filter((x) => x && x.name) : [];
  s.buy = Array.isArray(s.buy) ? s.buy.filter((x) => x && x.name) : [];
  s.food.forEach((f) => { if (!PLACE_NAME[f.place]) f.place = 'fridge'; f.id ||= uid(); f.added ||= today(); });
  s.supplies.forEach((x) => {
    x.id ||= uid();
    x.stock = Math.max(0, parseInt(x.stock, 10) || 0);
    x.min = Math.max(0, parseInt(x.min, 10) || 0);
    if (!Array.isArray(x.opened)) x.opened = [];
  });
  if (s.foodFilter !== 'all' && !PLACE_NAME[s.foodFilter]) s.foodFilter = 'all';
  if (typeof s.supFilter !== 'string') s.supFilter = 'all';
  return s;
}
let state = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

/* ── 되돌리기 안내 ── */
let snackTimer;
function snack(msg, actions = []) {
  const el = $('hmSnack');
  el.innerHTML = `<span>${esc(msg)}</span>` + actions.map((a, i) => `<button type="button" data-i="${i}">${esc(a.label)}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { actions[b.dataset.i].run(); hide(); }));
  el.classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hide, actions.length ? 6000 : 2600);
  function hide() { el.classList.remove('show'); clearTimeout(snackTimer); }
}

/* ── 계산 ── */
function dueInfo(f) {
  if (!f.exp) return { cls: '', text: '', days: Infinity };
  const d = daysBetween(today(), f.exp);
  if (d < 0) return { cls: 'over', text: `${-d}일 지남`, days: d };
  if (d === 0) return { cls: 'soon', text: '오늘까지', days: d };
  if (d <= SOON) return { cls: 'soon', text: `${d}일 남음`, days: d };
  return { cls: '', text: d <= 60 ? `${d}일 남음` : md(f.exp) + '까지', days: d };
}
function sortedFood(list) {
  return list.slice().sort((a, b) => {
    const da = dueInfo(a).days, db = dueInfo(b).days;
    if (da !== db) return da - db;
    return (a.added || '').localeCompare(b.added || '');
  });
}
// 최근 뜯은 날들의 간격 평균 (최대 5번)
function cycle(x) {
  const o = x.opened.slice().sort();
  if (o.length < 2) return null;
  const recent = o.slice(-6);
  let sum = 0;
  for (let i = 1; i < recent.length; i++) sum += daysBetween(recent[i - 1], recent[i]);
  const avg = Math.max(1, Math.round(sum / (recent.length - 1)));
  const last = recent[recent.length - 1];
  const next = parse(last); next.setDate(next.getDate() + avg);
  return { avg, last, next: keyOf(next) };
}
const isLow = (x) => x.stock <= x.min;
const catsInUse = () => [...new Set(state.supplies.map((x) => x.cat || '기타'))];

/* ── 그리기 ── */
function renderStats() {
  const n = state.food.length;
  const by = Object.fromEntries(PLACES.map(([k]) => [k, state.food.filter((f) => f.place === k).length]));
  const over = state.food.filter((f) => dueInfo(f).days < 0).length;
  const soon = state.food.filter((f) => { const d = dueInfo(f).days; return d >= 0 && d <= SOON; }).length;
  const low = state.supplies.filter(isLow).length;
  const buyN = low + state.buy.length;
  $('hmStats').innerHTML = `
    <div class="stat"><div class="k">냉장고·찬장</div><div class="v">${n}가지</div><div class="s">냉장 ${by.fridge} / 냉동 ${by.freezer} / 찬장 ${by.pantry}</div></div>
    <div class="stat"><div class="k">유통기한</div><div class="v">${soon + over ? `${soon + over}가지` : '여유'}</div><div class="s">${over ? `지난 것 ${over}, ` : ''}${SOON}일 안 ${soon}</div></div>
    <div class="stat"><div class="k">소모품</div><div class="v">${state.supplies.length}가지</div><div class="s">여분 ${state.supplies.reduce((s, x) => s + x.stock, 0)}개</div></div>
    <div class="stat"><div class="k">살 것</div><div class="v">${buyN ? `${buyN}가지` : '없음'}</div><div class="s">${low ? `떨어져 가는 소모품 ${low}` : '소모품은 넉넉해요'}</div></div>`;
}

function renderFood() {
  const f = state.foodFilter;
  $('foodSeg').innerHTML = [['all', '전체'], ...PLACES].map(([k, name]) => {
    const c = k === 'all' ? state.food.length : state.food.filter((x) => x.place === k).length;
    return `<button type="button" data-f="${k}" aria-pressed="${f === k}">${name}<small>${c}</small></button>`;
  }).join('');
  const list = sortedFood(state.food.filter((x) => f === 'all' || x.place === f));
  $('foodList').innerHTML = list.length ? list.map((x) => {
    const d = dueInfo(x);
    const meta = [f === 'all' ? PLACE_NAME[x.place] : '', x.added ? `${md(x.added)}에 넣음` : '', x.memo || ''].filter(Boolean).join(' · ');
    return `<li class="goal hm-food ${d.cls}" data-id="${x.id}">
      <button type="button" class="chk" data-eat aria-label="다 먹음: ${esc(x.name)}"></button>
      <button type="button" class="hm-open" data-edit>
        <div class="gtitle">${esc(x.name)}${x.qty ? `<span class="hm-qty">${esc(x.qty)}</span>` : ''}</div>
        ${meta ? `<div class="gmeta">${esc(meta)}</div>` : ''}
      </button>
      ${d.text ? `<span class="hm-due ${d.cls}">${d.text}</span>` : ''}
    </li>`;
  }).join('') : `<li class="empty">${f === 'all' ? '아직 아무것도 없어요. 아래에 지금 들어 있는 것을 적어 보세요.' : `${PLACE_NAME[f]}에 넣어 둔 게 없어요.`}</li>`;
  $('fPlace').innerHTML = PLACES.map(([k, n]) => `<option value="${k}"${k === (f === 'all' ? 'fridge' : f) ? ' selected' : ''}>${n}</option>`).join('');
}

function dotsHTML(x) {
  const show = Math.min(x.stock, 8);
  const need = Math.max(0, Math.min(x.min + 1 - x.stock, 8 - show));
  let h = '<i></i>'.repeat(show) + '<i class="need"></i>'.repeat(isLow(x) ? need : 0);
  if (x.stock > 8) h += `<small>+${x.stock - 8}</small>`;
  if (x.stock === 0 && !need) h = '<small>0</small>';
  return h;
}
function renderSupplies() {
  const cats = catsInUse();
  if (state.supFilter !== 'all' && !cats.includes(state.supFilter)) state.supFilter = 'all';
  const f = state.supFilter;
  $('supSeg').innerHTML = [['all', '전체', state.supplies.length], ...cats.map((c) => [c, c, state.supplies.filter((x) => (x.cat || '기타') === c).length])]
    .map(([k, name, c]) => `<button type="button" data-f="${esc(k)}" aria-pressed="${f === k}">${esc(name)}<small>${c}</small></button>`).join('');
  $('supSeg').hidden = cats.length < 2;
  $('catOptions').innerHTML = [...new Set([...cats, ...DEFAULT_CATS])].map((c) => `<option value="${esc(c)}">`).join('');

  const list = state.supplies.filter((x) => f === 'all' || (x.cat || '기타') === f)
    .sort((a, b) => (isLow(b) - isLow(a)) || (a.cat || '').localeCompare(b.cat || '') || a.name.localeCompare(b.name));
  $('supList').innerHTML = list.length ? list.map((x) => {
    const c = cycle(x);
    const bits = [];
    if (f === 'all' && x.cat) bits.push(x.cat);
    if (c) {
      bits.push(`보통 ${c.avg}일마다 새로 뜯음`);
      const left = daysBetween(today(), c.next);
      bits.push(left < 0 ? `다음 뜯을 때가 ${-left}일 지났어요` : left === 0 ? '오늘쯤 새로 뜯을 차례' : `다음은 ${md(c.next)}쯤`);
    } else if (x.opened.length === 1) bits.push(`${md(x.opened[0])}에 뜯음`);
    if (x.memo) bits.push(x.memo);
    const label = `${x.name}: 여분 ${x.stock}개`;
    return `<li class="goal hm-sup${isLow(x) ? ' low' : ''}" data-id="${x.id}">
      <button type="button" class="hm-open" data-edit>
        <div class="gtitle">${esc(x.name)}</div>
        ${bits.length ? `<div class="gmeta">${esc(bits.join(' · '))}</div>` : ''}
      </button>
      <div class="hm-dots" role="img" aria-label="${esc(label)}">${dotsHTML(x)}</div>
      <div class="hm-act">
        <button type="button" class="btn ghost small" data-open title="여분 하나를 새로 뜯어요">뜯음</button>
        <button type="button" class="btn ghost small" data-plus aria-label="${esc(x.name)} 하나 샀음">+1</button>
      </div>
    </li>`;
  }).join('') : '<li class="empty">샴푸, 바디워시, 세탁세제, 섬유유연제, 휴지처럼 떨어지면 곤란한 것부터 적어 보세요.</li>';
}

function renderBuy() {
  const auto = state.supplies.filter(isLow);
  const rows = [
    ...auto.map((x) => `<li class="goal hm-buy auto" data-sup="${x.id}">
      <button type="button" class="chk" data-bought aria-label="샀음: ${esc(x.name)} (여분 +1)"></button>
      <div class="gbody"><div class="gtitle">${esc(x.name)}</div><div class="gmeta">소모품 · 여분 <b>${x.stock}개</b> 남음${x.cat ? ` · ${esc(x.cat)}` : ''}</div></div>
    </li>`),
    ...state.buy.map((b) => `<li class="goal hm-buy" data-buy="${b.id}">
      <button type="button" class="chk" data-bought aria-label="샀음: ${esc(b.name)}"></button>
      <div class="gbody"><div class="gtitle">${esc(b.name)}</div>${b.note ? `<div class="gmeta">${esc(b.note)}</div>` : ''}</div>
      <button type="button" class="del" data-del aria-label="${esc(b.name)} 지우기">×</button>
    </li>`),
  ];
  $('buyList').innerHTML = rows.length ? rows.join('') : '<li class="empty">살 게 없어요.</li>';
  $('copyBuy').hidden = !rows.length;
}

function render() { renderStats(); renderFood(); renderSupplies(); renderBuy(); }

/* ── 냉장고·찬장 ── */
$('foodSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  state.foodFilter = b.dataset.f; save(); renderFood();
});
$('foodForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const names = splitNames($('fName').value);
  if (!names.length) return;
  const place = $('fPlace').value, exp = $('fExp').value;
  names.forEach((name) => state.food.push({ id: uid(), name: name.slice(0, 40), place, exp, added: today(), qty: '', memo: '' }));
  save(); $('fName').value = ''; $('fExp').value = ''; render(); $('fName').focus();
});
function eatFood(id) {
  const i = state.food.findIndex((x) => x.id === id); if (i < 0) return;
  const [item] = state.food.splice(i, 1);
  save(); render();
  const actions = [{ label: '되돌리기', run: () => { state.food.splice(i, 0, item); save(); render(); } }];
  if (!state.buy.some((b) => b.name === item.name) && !state.food.some((f) => f.name === item.name))
    actions.push({ label: '살 것에 추가', run: () => { state.buy.push({ id: uid(), name: item.name, note: PLACE_NAME[item.place] }); save(); render(); } });
  snack(`${item.name} 다 먹음`, actions);
}
let editingFood = null;
$('foodList').addEventListener('click', (e) => {
  const li = e.target.closest('[data-id]'); if (!li) return;
  if (e.target.closest('[data-eat]')) return eatFood(li.dataset.id);
  if (!e.target.closest('[data-edit]')) return;
  const x = state.food.find((f) => f.id === li.dataset.id); if (!x) return;
  editingFood = x.id;
  $('fdName').value = x.name;
  $('fdPlace').innerHTML = PLACES.map(([k, n]) => `<option value="${k}"${k === x.place ? ' selected' : ''}>${n}</option>`).join('');
  $('fdQty').value = x.qty || ''; $('fdExp').value = x.exp || ''; $('fdAdded').value = x.added || ''; $('fdMemo').value = x.memo || '';
  $('foodDlg').showModal();
});
$('foodDlg').addEventListener('close', () => {
  if ($('foodDlg').returnValue !== 'ok') return;
  const x = state.food.find((f) => f.id === editingFood); if (!x) return;
  x.name = $('fdName').value.trim() || x.name; x.place = $('fdPlace').value; x.qty = $('fdQty').value.trim();
  x.exp = $('fdExp').value; x.added = $('fdAdded').value || x.added; x.memo = $('fdMemo').value.trim();
  save(); render();
});
$('fdDelete').addEventListener('click', () => { $('foodDlg').close('cancel'); eatFood(editingFood); });

/* ── 소모품 ── */
$('supSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  state.supFilter = b.dataset.f; save(); renderSupplies();
});
$('supForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('sName').value.trim(); if (!name) return;
  const cat = $('sCat').value.trim() || (state.supFilter !== 'all' ? state.supFilter : '');
  state.supplies.push({ id: uid(), name, cat, stock: Math.max(0, parseInt($('sStock').value, 10) || 0), min: 0, opened: [], memo: '' });
  save(); $('sName').value = ''; $('sStock').value = '1'; render(); $('sName').focus();
});
$('supList').addEventListener('click', (e) => {
  const li = e.target.closest('[data-id]'); if (!li) return;
  const x = state.supplies.find((s) => s.id === li.dataset.id); if (!x) return;
  if (e.target.closest('[data-open]')) {
    const before = { stock: x.stock, opened: x.opened.slice() };
    if (x.stock > 0) x.stock--;
    if (x.opened[x.opened.length - 1] !== today()) x.opened.push(today());
    x.opened = x.opened.slice(-12);
    save(); render();
    const c = cycle(x);
    snack(before.stock > 0 ? `${x.name} 새로 뜯음, 여분 ${x.stock}개` + (c ? ` · 보통 ${c.avg}일 가요` : '') : `${x.name} 뜯음 (여분이 없어서 살 것에 올렸어요)`,
      [{ label: '되돌리기', run: () => { x.stock = before.stock; x.opened = before.opened; save(); render(); } }]);
  } else if (e.target.closest('[data-plus]')) {
    x.stock = Math.min(99, x.stock + 1); save(); render();
    snack(`${x.name} 여분 ${x.stock}개`, [{ label: '되돌리기', run: () => { x.stock = Math.max(0, x.stock - 1); save(); render(); } }]);
  } else if (e.target.closest('[data-edit]')) openSup(x);
});
let editingSup = null;
function openSup(x) {
  editingSup = x.id;
  $('sdName').value = x.name; $('sdCat').value = x.cat || ''; $('sdStock').value = x.stock; $('sdMin').value = x.min; $('sdMemo').value = x.memo || '';
  const o = x.opened.slice().sort().reverse();
  $('sdHistory').textContent = o.length ? `최근 뜯은 날: ${o.slice(0, 6).map(md).join(', ')}` : '아직 뜯은 기록이 없어요. 새 걸 뜯을 때 목록에서 \'뜯음\'을 누르세요.';
  $('supDlg').showModal();
}
$('supDlg').addEventListener('close', () => {
  if ($('supDlg').returnValue !== 'ok') return;
  const x = state.supplies.find((s) => s.id === editingSup); if (!x) return;
  x.name = $('sdName').value.trim() || x.name; x.cat = $('sdCat').value.trim();
  x.stock = Math.max(0, Math.min(99, parseInt($('sdStock').value, 10) || 0));
  x.min = Math.max(0, Math.min(20, parseInt($('sdMin').value, 10) || 0));
  x.memo = $('sdMemo').value.trim();
  save(); render();
});
$('sdDelete').addEventListener('click', () => {
  const i = state.supplies.findIndex((s) => s.id === editingSup); if (i < 0) return;
  $('supDlg').close('cancel');
  const [item] = state.supplies.splice(i, 1); save(); render();
  snack(`${item.name} 삭제함`, [{ label: '되돌리기', run: () => { state.supplies.splice(i, 0, item); save(); render(); } }]);
});

/* ── 살 것 ── */
$('buyForm').addEventListener('submit', (e) => {
  e.preventDefault();
  splitNames($('bName').value).forEach((name) => { if (!state.buy.some((b) => b.name === name)) state.buy.push({ id: uid(), name: name.slice(0, 40) }); });
  save(); $('bName').value = ''; render(); $('bName').focus();
});
$('buyList').addEventListener('click', (e) => {
  const li = e.target.closest('li'); if (!li) return;
  if (li.dataset.sup && e.target.closest('[data-bought]')) {
    const x = state.supplies.find((s) => s.id === li.dataset.sup); if (!x) return;
    x.stock = Math.min(99, x.stock + 1); save(); render();
    snack(`${x.name} 샀음, 여분 ${x.stock}개`, [{ label: '되돌리기', run: () => { x.stock = Math.max(0, x.stock - 1); save(); render(); } }]);
  } else if (li.dataset.buy && (e.target.closest('[data-bought]') || e.target.closest('[data-del]'))) {
    const bought = !!e.target.closest('[data-bought]');
    const i = state.buy.findIndex((b) => b.id === li.dataset.buy); if (i < 0) return;
    const [item] = state.buy.splice(i, 1); save(); render();
    const actions = [{ label: '되돌리기', run: () => { state.buy.splice(i, 0, item); save(); render(); } }];
    if (bought) actions.push({ label: '냉장고에 넣기', run: () => { state.food.push({ id: uid(), name: item.name, place: 'fridge', exp: '', added: today(), qty: '', memo: '' }); save(); render(); } });
    snack(bought ? `${item.name} 샀음` : `${item.name} 지움`, actions);
  }
});
$('copyBuy').addEventListener('click', async () => {
  const names = [...state.supplies.filter(isLow).map((x) => x.name), ...state.buy.map((b) => b.name)];
  const text = names.map((n) => `- ${n}`).join('\n');
  try { await navigator.clipboard.writeText(text); snack(`${names.length}가지를 복사했어요`); }
  catch (e) { prompt('아래 목록을 복사하세요', names.join(', ')); }
});

// 다른 탭(브라우저 탭)에서 바뀌면 다시 그리기
window.addEventListener('storage', (e) => { if (e.key === KEY) { state = load(); render(); } });
// 자정이 지나면 남은 날짜를 다시 계산
let day = today();
setInterval(() => { if (today() !== day) { day = today(); render(); } }, 60000);

render();
})();
</script>
</body>
</html>
